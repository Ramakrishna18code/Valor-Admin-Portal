spring.application.name=valor-admin-backend
server.port=${PORT:8081}
server.address=0.0.0.0
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/valor;MODE=MySQL;AUTO_SERVER=TRUE}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.h2.console.enabled=${H2_CONSOLE:true}
spring.jackson.default-property-inclusion=non_null
valor.jwt.secret=${VALOR_JWT_SECRET:valor-local-development-secret-change-before-production-please}
valor.jwt.expiration-hours=${VALOR_JWT_EXPIRATION_HOURS:12}
valor.cors.allowed-origins=${VALOR_CORS_ORIGINS:http://localhost:5173,http://localhost:4173}
springdoc.swagger-ui.path=/swagger-ui.html
